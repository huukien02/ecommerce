version: '3.8'

services:
  client:
    build:
      context: .
    container_name: client_app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      HOSTNAME: 0.0.0.0
    command: npx next dev --webpack
    restart: unless-stopped

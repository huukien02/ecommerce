version: '3.8'

services:
  client:
    build:
      context: .
    container_name: client_app
    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      HOSTNAME: 0.0.0.0

    command: npm run dev

    restart: unless-stopped
